version: '3.8'

services:

  serviceregistry:
    image: magnesiumsniper/serviceregistry:0.0.1
    container_name: serviceregistry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 5

  configserver:
    image: magnesiumsniper/configserver:0.0.1
    container_name: configserver
    ports:
      - "7072:7072"
    environment:
      - EUREKA_SERVER_ADDRESS=http://serviceregistry:8761/eureka/
    depends_on:
      serviceregistry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7072/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gatewayservice:
    image: magnesiumsniper/gatewayservice:0.0.1
    container_name: gatewayservice
    ports:
      - "7073:7073"
    environment:
      - CONFIG_SERVER_URL=configserver
      - EUREKA_SERVER_ADDRESS=http://serviceregistry:8761/eureka/
    depends_on:
      configserver:
        condition: service_healthy
  productservice:
    image: magnesiumsniper/productservice:0.0.1
    container_name: productservice
    ports:
      - "8081:8081"
    environment:
      - CONFIG_SERVER_URL=configserver
      - EUREKA_SERVER_ADDRESS=http://serviceregistry:8761/eureka/
    depends_on:
      configserver:
        condition: service_healthy